services:
  target:
    build:
      context: .
      dockerfile: network/Dockerfile.target
    container_name: target
    cap_add: [NET_ADMIN]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_URL: http://host.docker.internal:8600      # Hyperledger Fabric gateway on the host (fabric/gateway/server.js)
    volumes:
      - ./detector:/root/detector
      - ./network:/opt/shield:ro                          # chain_report.py, chainlib.py, ipcrypt.py
      - ./multi:/opt/multi:ro                             # tlsutil.py (chainlib imports it)
    networks:
      lab:
        ipv4_address: 172.30.0.10
    command: >
      bash -c "(id testuser || (useradd -m testuser && echo 'testuser:password123' | chpasswd)) &&
      echo 'auth,authpriv.* /var/log/auth.log' > /etc/rsyslog.d/50-default.conf &&
      touch /var/log/auth.log && chown syslog:adm /var/log/auth.log && service ssh start && rsyslogd && sleep infinity"

  peer:
    build:
      context: .
      dockerfile: network/Dockerfile.peer
    container_name: peer
    networks:
      lab:
        ipv4_address: 172.30.0.11
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_URL: http://host.docker.internal:8600
      PYTHONPATH: /opt/shield
    volumes:
      - ./network:/opt/shield:ro
      - ./multi:/opt/multi:ro
    restart: unless-stopped
  attacker:
    image: kalilinux/kali-rolling
    container_name: attacker
    tty: true
    stdin_open: true
    networks:
      lab:
        ipv4_address: 172.30.0.12
    command: >
      bash -c "apt-get update && apt-get install -y hydra iputils-ping openssh-client &&
      (printf 'password\n123456\nadmin\nletmein\n' > /tmp/pw.txt || true) && sleep infinity"

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
